"}, {"id": 7, "name": "The Factory Floor", "domain": "Scheduling", "weight": 12, "icon": "🏭"}, {"id": 8, "name": "The Distribution Network", "domain": "Distribution", "weight": 8, "icon": "🚛"}, {"id": 9, "name": "The Quality Citadel", "domain": "Quality & Tech", "weight": 9, "icon": "🏆"}], "ranks": [{"xp": 0, "name": "Recruit", "icon": "🪖"}, {"xp": 500, "name": "Analyst", "icon": "📋"}, {"xp": 1500, "name": "Planner", "icon": "📦"}, {"xp": 3000, "name": "Scheduler", "icon": "🔧"}, {"xp": 5000, "name": "Operations Manager", "icon": "📊"}, {"xp": 8000, "name": "Director of Supply Chain", "icon": "🏭"}, {"xp": 12000, "name": "VP of Operations", "icon": "🎯"}, {"xp": 17000, "name": "CPIM Candidate", "icon": "📜"}, {"xp": 25000, "name": "Certified", "icon": "✅"}]}
</script>

<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("app-data").textContent);
  const CARDS = DATA.cards;
  const DOMAIN_LABELS = DATA.domainLabels;
  const GLOSSARY = DATA.glossary;
  const FORMULAS = DATA.formulas;
  const RESOURCES = DATA.resources;
  const ZONES = DATA.zones;
  const RANKS = DATA.ranks;

  /* ---------------- State / localStorage ---------------- */
  const STORAGE_KEY = "cpimGauntletState";

  function defaultState(){
    const zoneState = {};
    ZONES.forEach((z,i)=>{ zoneState[z.id] = i===0 ? "current" : "locked"; });
    return { xp:0, streak:0, zones:zoneState };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return Object.assign(defaultState(), parsed, { zones: Object.assign(defaultState().zones, parsed.zones||{}) });
    }catch(e){
      return defaultState();
    }
  }

  let state = loadState();

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function rankForXp(xp){
    let current = RANKS[0];
    for(const r of RANKS){
      if(xp >= r.xp) current = r;
    }
    return current;
  }

  function nextRankForXp(xp){
    for(const r of RANKS){
      if(r.xp > xp) return r;
    }
    return null;
  }

  /* ---------------- Navigation ---------------- */
  const TAB_TITLES = {
    dashboard:["🏠 Dashboard",""],
    flashcards:["🃏 Flashcards",""],
    formulas:["📐 Formulas",""],
    glossary:["📖 Glossary",""],
    resources:["🔗 Resources",""]
  };

  function showView(name){
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+name).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.view===name);
    });
    document.getElementById("az-rail").style.display = name==="glossary" ? "flex" : "none";
    const t = TAB_TITLES[name];
    document.getElementById("topbar-title").textContent = t[0];
    document.getElementById("topbar-sub").textContent = t[1];
    window.scrollTo(0,0);
  }

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>showView(btn.dataset.view));
  });

  /* ---------------- Dashboard ---------------- */
  function renderDashboard(){
    const rank = rankForXp(state.xp);
    const nextRank = nextRankForXp(state.xp);
    document.getElementById("dash-rank").textContent = rank.icon + " " + rank.name;
    const label = document.getElementById("dash-xp-label");
    const fill = document.getElementById("dash-xp-fill");
    if(nextRank){
      const span = nextRank.xp - rank.xp;
      const progressed = state.xp - rank.xp;
      const pct = Math.max(0, Math.min(100, (progressed/span)*100));
      fill.style.width = pct + "%";
      label.textContent = state.xp.toLocaleString() + " / " + nextRank.xp.toLocaleString() + " XP to " + nextRank.name;
    }else{
      fill.style.width = "100%";
      label.textContent = state.xp.toLocaleString() + " XP — MAX RANK";
    }

    const clearedCount = Object.values(state.zones).filter(s=>s==="cleared").length;
    document.getElementById("zone-progress-fill").style.width = (clearedCount/ZONES.length*100) + "%";
    document.getElementById("zone-progress-label").textContent = clearedCount + " / " + ZONES.length + " zones cleared";

    document.getElementById("streak-count").textContent = state.streak;

    const grid = document.getElementById("zone-grid");
    grid.innerHTML = "";
    ZONES.forEach(z=>{
      const st = state.zones[z.id];
      const div = document.createElement("div");
      div.className = "zone-card " + st;
      div.innerHTML =
        '<div class="zone-badge">'+(st==="cleared"?"✅":st==="current"?"▶️":"🔒")+'</div>'+
        '<div class="zone-icon">'+z.icon+'</div>'+
        '<div class="zone-name">'+z.name+'</div>'+
        '<div class="zone-weight">'+z.domain+' · '+z.weight+'%</div>';
      div.addEventListener("click", ()=>cycleZone(z.id));
      grid.appendChild(div);
    });

    const ladder = document.getElementById("rank-ladder");
    ladder.innerHTML = "";
    RANKS.forEach(r=>{
      const row = document.createElement("div");
      row.className = "rank-row" + (state.xp>=r.xp ? " achieved" : "");
      row.innerHTML =
        '<div class="rank-icon">'+r.icon+'</div>'+
        '<div class="rank-name">'+r.name+'</div>'+
        '<div class="rank-xp">'+r.xp.toLocaleString()+' XP</div>';
      ladder.appendChild(row);
    });
  }

  function cycleZone(id){
    const order = ["locked","current","cleared"];
    const cur = state.zones[id];
    const idx = order.indexOf(cur);
    state.zones[id] = order[(idx+1)%order.length];
    saveState();
    renderDashboard();
  }

  document.getElementById("xp-plus").addEventListener("click", ()=>{
    state.xp += 50; saveState(); renderDashboard();
  });
  document.getElementById("xp-minus").addEventListener("click", ()=>{
    state.xp = Math.max(0, state.xp-50); saveState(); renderDashboard();
  });
  document.getElementById("streak-plus").addEventListener("click", ()=>{
    state.streak += 1; saveState(); renderDashboard();
  });
  document.getElementById("streak-minus").addEventListener("click", ()=>{
    state.streak = Math.max(0, state.streak-1); saveState(); renderDashboard();
  });

  /* ---------------- Flashcards ---------------- */
  let deck = [];
  let deckIdx = 0;
  let flipped = false;
  let sessionScore = { got:0, missed:0, seen:{} };
  let currentFilter = "all";

  function buildFilterOptions(){
    const sel = document.getElementById("flash-filter");
    const domains = Array.from(new Set(CARDS.map(c=>c.t)));
    sel.innerHTML = '<option value="all">All Domains ('+CARDS.length+')</option>';
    domains.forEach(d=>{
      const count = CARDS.filter(c=>c.t===d).length;
      const label = DOMAIN_LABELS[d] || d;
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = label + " (" + count + ")";
      sel.appendChild(opt);
    });
    sel.addEventListener("change", ()=>{
      currentFilter = sel.value;
      buildDeck();
    });
  }

  function buildDeck(){
    deck = currentFilter==="all" ? CARDS.slice() : CARDS.filter(c=>c.t===currentFilter);
    deckIdx = 0;
    flipped = false;
    sessionScore = { got:0, missed:0, seen:{} };
    document.getElementById("flash-deck-wrap").style.display = "block";
    document.getElementById("flash-score-wrap").style.display = "none";
    renderCard();
  }

  function shuffleDeck(){
    for(let i=deck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]] = [deck[j],deck[i]];
    }
    deckIdx = 0;
    flipped = false;
    renderCard();
  }

  function renderCard(){
    if(deck.length===0){
      document.getElementById("flash-counter").textContent = "0/0";
      document.getElementById("flash-front-text").textContent = "No cards in this filter.";
      return;
    }
    const card = deck[deckIdx];
    const label = DOMAIN_LABELS[card.t] || card.t;
    document.getElementById("flash-tag-front").textContent = label;
    document.getElementById("flash-tag-back").textContent = label;
    document.getElementById("flash-front-text").textContent = card.f;
    document.getElementById("flash-back-text").textContent = card.b;
    document.getElementById("flash-counter").textContent = (deckIdx+1)+"/"+deck.length;
    document.getElementById("flash-progress-fill").style.width = ((deckIdx+1)/deck.length*100)+"%";
    const flipCard = document.getElementById("flip-card");
    flipped = false;
    flipCard.classList.remove("flipped");
  }

  function flipCardToggle(){
    flipped = !flipped;
    document.getElementById("flip-card").classList.toggle("flipped", flipped);
  }

  function goToIndex(i){
    if(deck.length===0) return;
    deckIdx = ((i % deck.length) + deck.length) % deck.length;
    renderCard();
  }

  function markCard(gotIt){
    if(deck.length===0) return;
    const card = deck[deckIdx];
    const key = card.f;
    if(!(key in sessionScore.seen)){
      sessionScore.seen[key] = true;
      if(gotIt) sessionScore.got++; else sessionScore.missed++;
    }
    if(deckIdx === deck.length-1){
      showScore();
    }else{
      goToIndex(deckIdx+1);
    }
  }

  function showScore(){
    const total = sessionScore.got + sessionScore.missed;
    const pct = total ? Math.round(sessionScore.got/total*100) : 0;
    document.getElementById("flash-deck-wrap").style.display = "none";
    const wrap = document.getElementById("flash-score-wrap");
    wrap.style.display = "block";
    wrap.innerHTML =
      '<div class="card flash-score">'+
      '<div class="big">'+pct+'%</div>'+
      '<div class="xp-label">'+sessionScore.got+' correct / '+sessionScore.missed+' missed</div>'+
      '<button id="flash-restart" style="margin-top:16px;">Study Again</button>'+
      '</div>';
    document.getElementById("flash-restart").addEventListener("click", buildDeck);
  }

  document.getElementById("flip-card").addEventListener("click", flipCardToggle);
  document.getElementById("flash-prev").addEventListener("click", ()=>goToIndex(deckIdx-1));
  document.getElementById("flash-next").addEventListener("click", ()=>goToIndex(deckIdx+1));
  document.getElementById("flash-got").addEventListener("click", ()=>markCard(true));
  document.getElementById("flash-missed").addEventListener("click", ()=>markCard(false));
  document.getElementById("flash-shuffle").addEventListener("click", shuffleDeck);

  // swipe gestures
  (function(){
    let startX=0, startY=0, tracking=false;
    const scene = document.getElementById("flip-scene");
    scene.addEventListener("touchstart", e=>{
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, {passive:true});
    scene.addEventListener("touchend", e=>{
      if(!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){
        if(dx < 0) goToIndex(deckIdx+1); else goToIndex(deckIdx-1);
      }
    }, {passive:true});
  })();

  /* ---------------- Formulas ---------------- */
  function renderFormulas(filterText){
    const q = (filterText||"").trim().toLowerCase();
    const list = document.getElementById("formula-list");
    list.innerHTML = "";
    let anyShown = false;

    FORMULAS.forEach(domain=>{
      const items = domain.items.filter(item=>{
        if(!q) return true;
        return (item.title+" "+item.formula+" "+item.notes.join(" ")).toLowerCase().includes(q);
      });
      if(items.length===0) return;
      anyShown = true;
      const h = document.createElement("div");
      h.className = "formula-domain-title";
      h.textContent = domain.domain;
      list.appendChild(h);

      items.forEach(item=>{
        const card = document.createElement("div");
        card.className = "formula-card";
        card.innerHTML =
          '<div class="formula-title">'+item.title+'</div>'+
          '<div class="formula-block">'+escapeHtml(item.formula)+'</div>'+
          (item.notes.length ? '<div class="formula-notes">'+item.notes.map(n=>'<div class="formula-note">'+escapeHtml(n)+'</div>').join("")+'</div>' : '')+
          '<div class="copy-hint">tap to copy</div>';
        card.addEventListener("click", ()=>{
          const text = item.title+"\n"+item.formula;
          copyToClipboard(text);
          card.classList.add("copied");
          setTimeout(()=>card.classList.remove("copied"), 900);
        });
        list.appendChild(card);
      });
    });

    if(!anyShown){
      list.innerHTML = '<div class="empty-state">No formulas match "'+escapeHtml(q)+'".</div>';
    }
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{});
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  document.getElementById("formula-search").addEventListener("input", e=>{
    renderFormulas(e.target.value);
  });

  /* ---------------- Glossary ---------------- */
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  function renderGlossary(filterText){
    const q = (filterText||"").trim().toLowerCase();
    const list = document.getElementById("glossary-list");
    list.innerHTML = "";
    const availableLetters = new Set();
    let lastLetter = null;
    let anyShown = false;

    GLOSSARY.forEach(entry=>{
      const haystack = (entry.term+" "+entry.def+" "+(entry.anchor||"")).toLowerCase();
      if(q && !haystack.includes(q)) return;
      anyShown = true;
      availableLetters.add(entry.letter);
      if(entry.letter !== lastLetter){
        const h = document.createElement("div");
        h.className = "glossary-letter-header";
        h.id = "letter-"+entry.letter;
        h.textContent = entry.letter;
        list.appendChild(h);
        lastLetter = entry.letter;
      }
      const card = document.createElement("div");
      card.className = "glossary-term-card";
      card.innerHTML =
        '<div class="glossary-term">'+escapeHtml(entry.term)+'</div>'+
        '<div class="glossary-def">'+escapeHtml(entry.def)+'</div>'+
        (entry.anchor ? '<div class="glossary-anchor">'+escapeHtml(entry.anchor)+'</div>' : '');
      list.appendChild(card);
    });

    if(!anyShown){
      list.innerHTML = '<div class="empty-state">No terms match "'+escapeHtml(q)+'".</div>';
    }

    renderAzRail(availableLetters, !!q);
  }

  function renderAzRail(availableLetters, isFiltering){
    const rail = document.getElementById("az-rail");
    rail.innerHTML = "";
    ALPHABET.forEach(letter=>{
      const span = document.createElement("span");
      span.textContent = letter;
      const has = availableLetters.has(letter);
      if(!has || isFiltering){
        span.className = "disabled";
      }else{
        span.addEventListener("click", ()=>{
          const target = document.getElementById("letter-"+letter);
          if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
        });
      }
      rail.appendChild(span);
    });
  }

  document.getElementById("glossary-search").addEventListener("input", e=>{
    renderGlossary(e.target.value);
  });

  /* ---------------- Resources ---------------- */
  function renderResources(){
    const list = document.getElementById("resource-list");
    list.innerHTML = "";
    RESOURCES.forEach(cat=>{
      if(cat.items.length===0) return;
      const h = document.createElement("div");
      h.className = "resource-category-title";
      h.textContent = cat.category;
      list.appendChild(h);
      cat.items.forEach(item=>{
        const a = document.createElement("a");
        a.className = "resource-card";
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML =
          '<span class="resource-arrow">↗</span>'+
          '<div class="resource-name">'+escapeHtml(item.name)+'</div>'+
          '<div class="resource-desc">'+escapeHtml(item.desc)+'</div>';
        list.appendChild(a);
      });
    });
  }

  /* ---------------- Init ---------------- */
  buildFilterOptions();
  buildDeck();
  renderDashboard();
  renderFormulas("");
  renderGlossary("");
  renderResources();
